name: Upgrade dependencies and verify

on:
  push:
    branches:
      - upgrade-theme-settings

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Upgrade root dependencies to latest compatible stable versions
        run: |
          npx --yes npm-check-updates@latest -u --target latest --reject typescript,@types/node,react-day-picker,vite,@vitejs/plugin-react
          rm -f package-lock.json
          npm install

      - name: Upgrade API dependencies to latest stable versions
        working-directory: api
        run: |
          npx --yes npm-check-updates@latest -u --target latest
          rm -f package-lock.json
          npm install

      - name: Apply compatibility cleanups
        run: |
          python - <<'PY'
          from pathlib import Path

          ai_provider = Path("src/services/ai-provider.ts")
          source = ai_provider.read_text()
          source = source.replace("let mockData = '';", "let mockData: string;")
          ai_provider.write_text(source)

          shorts = Path("src/sections/ShortsGenerator.tsx")
          source = shorts.read_text()
          source = source.replace("Instagram", "Camera")
          shorts.write_text(source)
          PY

      - name: Commit upgrade changes
        run: |
          if git diff --quiet; then
            echo "Dependencies and compatibility migrations are already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json api/package.json api/package-lock.json src/services/ai-provider.ts src/sections/ShortsGenerator.tsx
            git commit -m "chore: refresh latest compatible dependency locks"
            git push
          fi

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Test API
        working-directory: api
        run: npm test -- --runInBand
