name: Upgrade dependencies and verify

on:
  push:
    branches:
      - upgrade-theme-settings

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Upgrade root dependencies within current major versions
        run: |
          npx --yes npm-check-updates@latest -u --target minor
          npm install

      - name: Upgrade API dependencies within current major versions
        working-directory: api
        run: |
          npx --yes npm-check-updates@latest -u --target minor
          npm install

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Test API
        working-directory: api
        run: npm test -- --runInBand

      - name: Commit refreshed dependency manifests and locks
        run: |
          if git diff --quiet -- package.json package-lock.json api/package.json api/package-lock.json; then
            echo "Dependencies are already current within the configured major versions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json api/package.json api/package-lock.json
          git commit -m "chore: refresh compatible dependencies"
          git push
